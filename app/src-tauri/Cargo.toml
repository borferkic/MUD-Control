[package]
name = "mud-control"
version = "2.0.0"
description = "MUD Control - Multi User Desktops Control"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "mud_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
